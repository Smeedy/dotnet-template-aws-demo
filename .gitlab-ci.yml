stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: 388762879096.dkr.ecr.eu-central-1.amazonaws.com
  IMAGE_NAME: "${REGISTRY}/forecast"
  IMAGE_TAG: "${CI_ENVIRONMENT_NAME}-${CI_PIPELINE_ID}"
  IMAGE_URL: "${IMAGE_NAME}:${IMAGE_TAG}"

# ------------------------------------------------------------
# Trunk mapping: branch -> CI_ENVIRONMENT_NAME
# ------------------------------------------------------------
.trunk_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(chore|feat|exp|hotfix)\/.+$/'
      variables: { CI_ENVIRONMENT_NAME: dev }
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables: { CI_ENVIRONMENT_NAME: prd }
      when: on_success
    - when: never

# ------------------------------------------------------------
# Shared kaniko template
# ------------------------------------------------------------
.kaniko:
  image: 440744237675.dkr.ecr.eu-central-1.amazonaws.com/tools/kaniko-project/executor:latest
  id_tokens:
    JWT_TOKEN:
      aud: $VAULT_ADDR
  tags:
    - docker

# ------------------------------------------------------------
# Build - auto on dev branches AND on main (rebuild)
# ------------------------------------------------------------
build:
  stage: build
  extends:
    - .kaniko
  environment:
    name: $CI_ENVIRONMENT_NAME
  rules:
    - !reference [.trunk_rules, rules]
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${IMAGE_URL}"

# ------------------------------------------------------------
# Upload - ONLY on main, manual
# ------------------------------------------------------------
upload:
  stage: deploy
  extends:
    - .kaniko
  environment:
    name: $CI_ENVIRONMENT_NAME
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables: { CI_ENVIRONMENT_NAME: prd }
      when: manual
    - when: never
  script:
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
        --destination "${IMAGE_URL}"
        --destination "${IMAGE_NAME}:latest"
